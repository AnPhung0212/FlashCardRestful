spring.application.name=firstDemoLearnSpring

# --- DB CONNECTION (Env vars) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JWT CONFIG (Env vars) ---
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=86400000

# --- JPA CONFIG ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2016Dialect

# --- MAIL CONFIG (Env vars) ---
# QUAN TRONG: Dat bien moi truong MAIL_USERNAME va MAIL_PASSWORD trong IntelliJ Run Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM_ADDRESS:${MAIL_USERNAME}}
app.mail.verification-base-url=${MAIL_VERIFICATION_URL:http://localhost:8080/api/auth/verify}

# --- SWAGGER/OPENAPI CONFIG ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs



